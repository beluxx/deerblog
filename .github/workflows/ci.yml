name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build (Zero CGO)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS (Minified)
        run: npx tailwindcss -i ./web/css/input.css -o ./static/css/tailwind.min.css --minify

      - name: Run Go Unit Tests (Zero CGO)
        env:
          CGO_ENABLED: 0
        run: go test -v ./internal/... ./cmd/...

      - name: Verify Single Binary Build (Zero CGO)
        env:
          CGO_ENABLED: 0
        run: go build -v -ldflags="-s -w" -o ./bin/deerblog ./cmd/server
