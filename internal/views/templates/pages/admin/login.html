<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 - {{ .Site.SiteTitle }}</title>
  <link rel="stylesheet" href="/static/css/tailwind.min.css">
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body class="min-h-screen bg-zinc-100 dark:bg-zinc-950 flex items-center justify-center p-4 antialiased">
  <div class="max-w-md w-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-8 shadow-xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 text-white font-bold text-xl flex items-center justify-center mx-auto mb-3 shadow-md">
        ✦
      </div>
      <h1 class="text-xl font-bold text-zinc-900 dark:text-zinc-100">管理员登录</h1>
      <p class="text-xs text-zinc-500 mt-1">进入博客管理控制台</p>
    </div>

    {{ if .Error }}
    <div class="mb-4 p-3 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs text-red-600 dark:text-red-400">
      {{ .Error }}
    </div>
    {{ end }}

    <form method="POST" action="/admin/login" class="space-y-4 text-xs">
      <div>
        <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">用户名</label>
        <input type="text" name="username" required autofocus placeholder="admin" class="w-full px-3 py-2.5 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 text-zinc-900 dark:text-zinc-100">
      </div>
      <div>
        <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">登录密码</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2.5 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 text-zinc-900 dark:text-zinc-100">
      </div>
      <button type="submit" class="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold transition shadow-sm">
        进入控制台
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-zinc-400">
      <a href="/" class="hover:underline">← 返回前台首页</a>
    </div>
  </div>
</body>
</html>
