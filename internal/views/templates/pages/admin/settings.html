{{ define "content" }}
<div class="max-w-3xl space-y-6">

  <div class="flex items-center justify-between pb-4 border-b border-zinc-200 dark:border-zinc-800">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">站点与博主设置</h1>
      <p class="text-xs text-zinc-500 mt-1">持久化保存在纯 Go BoltDB 中，修改后即时全站生效，无需重启服务。</p>
    </div>
  </div>

  {{ if .Message }}
  <div class="p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-xs text-emerald-700 dark:text-emerald-300 flex items-center gap-2">
    <span>✓</span>
    <span>{{ .Message }}</span>
  </div>
  {{ end }}

  <form action="/admin/settings" method="POST" class="p-6 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm space-y-6 text-xs">
    
    <div class="space-y-4">
      <h2 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 pb-2 border-b border-zinc-100 dark:border-zinc-800">
        博客基本信息
      </h2>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">站点名称 (Site Title)</label>
          <input type="text" name="site_title" required value="{{ .Settings.SiteTitle }}" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 font-semibold">
        </div>
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">副标题 (Subtitle)</label>
          <input type="text" name="site_subtitle" required value="{{ .Settings.SiteSubtitle }}" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500">
        </div>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 pb-2 border-b border-zinc-100 dark:border-zinc-800">
        博主个人资料
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">博主姓名 / 昵称</label>
          <input type="text" name="author_name" required value="{{ .Settings.AuthorName }}" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 font-semibold">
        </div>
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">联系邮箱</label>
          <input type="email" name="email" value="{{ .Settings.Email }}" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div>
        <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">座右铭 / 个人简介 (Bio)</label>
        <textarea name="author_bio" rows="3" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 leading-relaxed">{{ .Settings.AuthorBio }}</textarea>
      </div>
    </div>

    <div class="space-y-4">
      <h2 class="text-sm font-bold text-zinc-900 dark:text-zinc-100 pb-2 border-b border-zinc-100 dark:border-zinc-800">
        社交媒体与开源主页
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">GitHub 链接</label>
          <input type="url" name="github_url" value="{{ .Settings.GithubURL }}" placeholder="https://github.com/your-username" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">Twitter / X 链接</label>
          <input type="url" name="twitter_url" value="{{ .Settings.TwitterURL }}" placeholder="https://x.com/your-username" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
      </div>
    </div>

    <div class="flex justify-end pt-4 border-t border-zinc-100 dark:border-zinc-800">
      <button type="submit" class="px-6 py-2.5 font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition">
        保存设置
      </button>
    </div>

  </form>

</div>
{{ end }}
