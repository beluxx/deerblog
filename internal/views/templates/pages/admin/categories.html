{{ define "content" }}
<div class="space-y-6">

  <div class="flex items-center justify-between pb-4 border-b border-zinc-200 dark:border-zinc-800">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">分类与标签管理</h1>
      <p class="text-xs text-zinc-500 mt-1">创建与维护博客的文章分类体系，优化读者归档导览体验。</p>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
    
    <!-- 左侧：新建分类表单 -->
    <div class="p-5 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow-sm text-xs space-y-4">
      <h2 class="font-bold text-sm text-zinc-900 dark:text-zinc-100">添加新分类</h2>
      <form action="/admin/categories/new" method="POST" class="space-y-3">
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">分类名称 *</label>
          <input type="text" name="name" required placeholder="如：系统架构" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">Slug (URL 路径) *</label>
          <input type="text" name="slug" required placeholder="architecture" class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500 font-mono">
        </div>
        <div>
          <label class="block font-medium text-zinc-700 dark:text-zinc-300 mb-1">描述说明</label>
          <textarea name="description" rows="3" placeholder="简短描述该分类包含的文章类型..." class="w-full px-3 py-2 rounded-lg bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <button type="submit" class="w-full py-2 font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition">
          确认添加
        </button>
      </form>
    </div>

    <!-- 右侧：已有分类列表 -->
    <div class="md:col-span-2 bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl overflow-hidden shadow-sm">
      <table class="w-full text-left text-xs">
        <thead class="bg-zinc-50 dark:bg-zinc-800/50 border-b border-zinc-200 dark:border-zinc-800 text-zinc-500 uppercase">
          <tr>
            <th class="p-4">分类名称</th>
            <th class="p-4">Slug 别名</th>
            <th class="p-4">文章数</th>
            <th class="p-4 text-right">操作</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-zinc-200 dark:divide-zinc-800">
          {{ range .Categories }}
          <tr class="hover:bg-zinc-50/50 dark:hover:bg-zinc-850/50 transition">
            <td class="p-4 font-semibold text-zinc-900 dark:text-zinc-100">
              <div>{{ .Name }}</div>
              <div class="text-[11px] text-zinc-400 font-normal mt-0.5">{{ .Description }}</div>
            </td>
            <td class="p-4 font-mono text-zinc-500">
              /category/{{ .Slug }}
            </td>
            <td class="p-4 text-zinc-600 dark:text-zinc-300">
              {{ .PostCount }} 篇
            </td>
            <td class="p-4 text-right space-x-2">
              <form action="/admin/categories/{{ .ID }}/delete" method="POST" class="inline" onsubmit="return confirm('确定要删除分类【{{ .Name }}】吗？{{ if gt .PostCount 0 }}\n\n⚠️ 注意：当前分类下有 {{ .PostCount }} 篇文章，删除后关联文章将自动变为未分类。{{ end }}');">
                <button type="submit" class="text-red-500 hover:text-red-700 font-medium">删除</button>
              </form>
            </td>
          </tr>
          {{ else }}
          <tr>
            <td colspan="4" class="p-8 text-center text-zinc-400">
              暂无分类，请在左侧表单中创建。
            </td>
          </tr>
          {{ end }}
        </tbody>
      </table>
    </div>

  </div>

</div>
{{ end }}
