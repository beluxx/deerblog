{{ define "content" }}
<div class="max-w-2xl mx-auto space-y-8">
  <div class="border-b border-zinc-200/80 dark:border-zinc-800/80 pb-4">
    <h1 class="text-3xl font-extrabold tracking-tight text-zinc-900 dark:text-zinc-50">
      文章归档
    </h1>
    <p class="mt-2 text-sm text-zinc-500 dark:text-zinc-400">
      历年撰写的技术思考、架构演进与随笔合集。
    </p>
  </div>

  <div class="space-y-10">
    {{ if .Posts }}
      <div class="relative border-l border-zinc-200 dark:border-zinc-800 ml-3 space-y-6">
        {{ range .Posts }}
        <div class="relative pl-6 group">
          <div class="absolute -left-1.5 top-1.5 w-3 h-3 rounded-full border-2 border-white dark:border-zinc-950 bg-zinc-300 dark:bg-zinc-700 group-hover:bg-indigo-500 transition-colors"></div>
          <div class="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1">
            <a href="/posts/{{ .Slug }}" class="text-base font-medium text-zinc-800 dark:text-zinc-200 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
              {{ .Title }}
            </a>
            <time class="text-xs text-zinc-400 font-mono shrink-0">
              {{ .CreatedAt.Format "2006-01-02" }}
            </time>
          </div>
        </div>
        {{ end }}
      </div>
    {{ else }}
      <p class="text-sm text-zinc-400 text-center py-10">暂无归档文章。</p>
    {{ end }}
  </div>
</div>
{{ end }}
